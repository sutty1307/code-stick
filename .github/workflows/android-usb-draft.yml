name: Assemble reviewed Android USB kit draft

# LOCAL PROPOSAL ONLY. Copy to .github/workflows/android-usb-draft.yml only after
# runtime evidence and final candidate seed have been reviewed. No main changes.
on:
  push:
    branches: [portable/android-usb-download]
    paths:
      - portable/android-release-seed/v0.10.1-usb.2/**
      - portable/scripts/assemble_and_draft.py
      - .github/workflows/android-usb-draft.yml

permissions: {}

concurrency:
  group: android-usb-draft-v0.10.1-usb.2
  cancel-in-progress: false

jobs:
  complete-kit:
    if: github.repository == 'sutty1307/code-stick' && github.ref == 'refs/heads/portable/android-usb-download'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out only the reviewed candidate commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify seed, download pinned model and validate complete ZIP
        run: >-
          python3 portable/scripts/assemble_and_draft.py assemble
          --seed portable/android-release-seed/v0.10.1-usb.2
          --output delivery-output
      - name: Create or resume the same draft prerelease and upload verified files
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 portable/scripts/assemble_and_draft.py draft
          --output delivery-output
          --target "$GITHUB_SHA"
          --create-draft
