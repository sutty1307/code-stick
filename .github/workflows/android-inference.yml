name: Android exact APK full model inference

# LOCAL PROPOSAL. Root reviews and integrates; this file has not been pushed/run.
on:
  push:
    branches: [repair/android-runtime-usb2]
    paths:
      - .github/workflows/android-inference.yml
      - portable/runtime/model_inference_smoke.py

permissions:
  contents: read

concurrency:
  group: android-full-model-inference
  cancel-in-progress: false

jobs:
  inference:
    if: github.repository == 'sutty1307/code-stick' && github.ref == 'refs/heads/repair/android-runtime-usb2'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Require ordinary hosted KVM acceleration
        run: |
          test -c /dev/kvm
          if ! test -r /dev/kvm || ! test -w /dev/kvm; then
            sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          fi
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Install emulator audio dependency
        timeout-minutes: 3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0
      - name: Real full GGUF inference in the exact offline Android APK
        timeout-minutes: 25
        run: >-
          python3 portable/runtime/model_inference_smoke.py
          --sdk "$ANDROID_HOME"
          --candidate portable/android/AI-Drive-Offline_v0.10.1-usb.2.apk
          --evidence inference-evidence
      - name: Retain actual screenshots, UI XML, logcat and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Android-full-model-${{ github.run_id }}-${{ github.run_attempt }}
          path: inference-evidence/
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6
