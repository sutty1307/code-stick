# Complete snippet for nginx's http{} context, e.g. /etc/nginx/conf.d/depositdesk.conf.
# Replace pay.example.com and certificate paths before enabling.
limit_req_zone $binary_remote_addr zone=desk_login:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=desk_hook:10m rate=60r/m;
server {
    listen 80;
    server_name pay.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 308 https://pay.example.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name pay.example.com;
    ssl_certificate /etc/letsencrypt/live/pay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pay.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    proxy_read_timeout 95s;
    proxy_request_buffering on;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    # Overwrite the client-supplied header. The app trusts only configured peer IPs.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    location = /api/login {
        limit_req zone=desk_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8765;
    }
    location = /api/webhooks/dwolla {
        limit_req zone=desk_hook burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8765;
    }
    location / { proxy_pass http://127.0.0.1:8765; }
}
